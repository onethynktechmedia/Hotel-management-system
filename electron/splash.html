<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhole Patil Khanawal - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #5D3A1A 0%, #8B4513 50%, #A0522D 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .logo-container {
      position: relative;
      width: 150px;
      height: 150px;
    }

    .logo-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
      animation: spin3d 3s ease-in-out infinite;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    .orbit-ring-inner {
      position: absolute;
      inset: 8px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: spin 1.5s linear infinite reverse;
    }

    .glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(40px);
      animation: pulse 2s ease-in-out infinite;
    }

    .text-container {
      text-align: center;
      color: white;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
      animation: fadeIn 1s ease-out;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.8;
      animation: fadeIn 1s ease-out 0.3s both;
    }

    .progress-container {
      width: 250px;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .progress-bar {
      height: 100%;
      background: white;
      border-radius: 4px;
      animation: progress 3s ease-out forwards;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes spin3d {
      0% {
        transform: rotateY(0deg) rotateX(0deg);
      }
      25% {
        transform: rotateY(90deg) rotateX(10deg);
      }
      50% {
        transform: rotateY(180deg) rotateX(0deg);
      }
      75% {
        transform: rotateY(270deg) rotateX(-10deg);
      }
      100% {
        transform: rotateY(360deg) rotateX(0deg);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.6;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progress {
      0% {
        width: 0%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="glow"></div>
      <div class="logo-wrapper">
        <img src="./logo.png" alt="Logo" class="logo" />
        <div class="orbit-ring"></div>
        <div class="orbit-ring-inner"></div>
      </div>
    </div>

    <div class="text-container">
      <div class="title">Dhole Patil Khanawal</div>
      <div class="subtitle">Hotel Management System</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
